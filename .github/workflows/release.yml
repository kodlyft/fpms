name: Generate Semantic Release

on:
  push:
    branches:
      - version-16

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: release-fpms
  cancel-in-progress: false

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      RELEASE_AUTH_TOKEN: ${{ secrets.RELEASE_TOKEN != '' && secrets.RELEASE_TOKEN || github.token }}
    steps:
      - name: Checkout Entire Repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: true
          token: ${{ env.RELEASE_AUTH_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20

      - name: Setup dependencies
        run: |
          npm install @semantic-release/git @semantic-release/exec --no-save

      - name: Create Release
        env:
          GH_TOKEN: ${{ env.RELEASE_AUTH_TOKEN }}
          GITHUB_TOKEN: ${{ env.RELEASE_AUTH_TOKEN }}
          GIT_AUTHOR_NAME: "FPMS Bot"
          GIT_AUTHOR_EMAIL: "hello@kodlyft.com"
          GIT_COMMITTER_NAME: "FPMS Bot"
          GIT_COMMITTER_EMAIL: "hello@kodlyft.com"
        run: npx semantic-release
